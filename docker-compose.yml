services:
  # Redis Database
  redis:
    image: redis:7-alpine
    container_name: ow-api-redis
    restart: unless-stopped
    # No host port mapping: Redis is only reachable from the compose network.
    # Exposing an unauthenticated Redis on the host is a common way to get owned.
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

  # API Service
  api:
    build:
      context: .
      target: api
    container_name: ow-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/var/lib/ow-api
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - CACHE_TTL=24h
      - API_TIMEOUT=5s
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - DEBUG=false
    volumes:
      - api-data:/var/lib/ow-api
    depends_on:
      redis:
        condition: service_healthy
    # The healthcheck is defined in the Dockerfile.

  # Scraper Service
  scraper:
    build:
      context: .
      target: scraper
    container_name: ow-api-scraper
    restart: unless-stopped
    environment:
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - CACHE_TTL=24h
      - SCRAPER_ENABLED=true
      - SCRAPER_INTERVAL=60m
    depends_on:
      redis:
        condition: service_healthy

# Persistent volumes
volumes:
  redis-data:
    driver: local
  api-data:
    driver: local
